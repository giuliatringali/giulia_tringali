---
layout: default
---
<div class="post about">
  <!-- Card header: photo + name + subtitle + social icons -->
  <header class="about-card">
    {%- if page.profile.image %}
    <img class="about-photo {% unless page.profile.image_circular %}square{% endunless %}"
         src="{{ page.profile.image | prepend: '/assets/img/' | relative_url }}"
         alt="{{ site.first_name }} {{ site.last_name }}">
    {%- endif %}
    <div class="about-info">
      <h1 class="about-name"><span class="font-weight-bold">{{ site.first_name }}</span> {{ site.last_name }}</h1>
      <p class="about-subtitle">{{ page.subtitle }}</p>
      {%- if page.social %}
      <div class="social">
        <div class="contact-icons">
          {% include social.html %}
        </div>
      </div>
      {%- endif %}
    </div>
  </header>

  <article>
    {{ content }}
  </article>
</div>
